name: Auto Warhold HQ Level Up & Earn 24/7

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: warhold-mining
  cancel-in-progress: true

jobs:
  run-warhold:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chay Auto Warhold Cho 2 Acc
        run: |
          python auto_warhold.py
